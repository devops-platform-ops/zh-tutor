[project]
name = "zhtutor"
version = "0.0.0"
description = "중국어 학습 플랫폼 — 회화·발음 채점·단어장·SRS 복습"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "faster-whisper",   # 로컬 STT
    "sounddevice",      # 마이크 녹음 (CLI)
    "numpy",
    "pypinyin",         # 발음(핀인·성조) 분석
    "gradio",           # 웹 UI
    "pymysql",          # Dolt sql-server 연결
    "onnxruntime<1.24", # faster-whisper VAD 의존 — Intel mac x86_64 휠 보장(1.24+ 미제공)
    "jieba>=0.42.1",
    "praat-parselmouth>=0.4.7",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
zh = "zhtutor.cli:main"
zhw = "zhtutor.web:main"
zh-read = "zhtutor.read:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhtutor"]
